# Import .env file for local property overrides (not committed to git)
# Use .env to define property overrides for local development
spring.config.import=optional:file:.env[.properties]

# ========== SERVER CONFIGURATION ==========
# Server ports to match Docker Compose configuration
server.port=8585
socket.port=8589
socket.host=0.0.0.0

# Trust X-Forwarded-* headers from reverse proxy (Nginx)
# Fixes Mixed Content errors: ensures request.isSecure()=true behind HTTPS proxy
server.forward-headers-strategy=framework

# Disable default error page
server.error.whitelabel.enabled=false

# ========== MULTIPART UPLOAD CONFIGURATION ==========
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Optional: allow large uploads without swallowing
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-post-size=50MB


# ========== LOGGING ==========
# Set root logging level to warn to reduce console output
logging.level.root=warn

# ========== JWT SECURITY CONFIGURATION ==========
# JWT secret key for signing tokens (base64 encoded, at least 32 bytes decoded).
# REQUIRED: startup fails if JWT_SECRET is unset, unless KIT_DEV_MODE=true, in which
# case a random per-boot secret is generated (all tokens die on restart).
# Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
# JWT Cookie settings - Production defaults (override in .env for local HTTP development)
jwt.cookie.secure=true
jwt.cookie.same-site=None
jwt.cookie.max-age=604800

# ========== SESSION CONFIGURATION ==========
# Session timeout (30 minutes)
spring.session.timeout=30m
# Custom session cookie name
server.servlet.session.cookie.name=sess_java_spring
# Session cookie must have SameSite=None; Secure for cross-origin requests
# Without this, browsers default SameSite=Lax and silently drop the cookie on cross-origin fetches
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ========== KIT CONFIGURATION ==========
# School-specific values. See .env.example for documentation.
kit.dev-mode=${KIT_DEV_MODE:false}
kit.school-name=${SCHOOL_NAME:OCS Kit}
kit.logo-url=${SCHOOL_LOGO_URL:/images/kit_logo.svg}
kit.frontend-url=${FRONTEND_URL:http://localhost:4500}
kit.admin-email=${ADMIN_EMAIL:admin@example.com}
# Domain attribute for the JWT cookie, e.g. ".myschool.org" to share it across
# subdomains. Empty means a host-only cookie.
kit.cookie-domain=${COOKIE_DOMAIN:}
# Comma-separated browser origins allowed to call this API with credentials.
# Wildcard patterns such as https://*.myschool.org are accepted.
kit.cors-origins=${CORS_ORIGINS:http://localhost:4500,http://127.0.0.1:4500,http://localhost:4000,http://localhost:8585}
# Comma-separated email domains accepted for Google OAuth password reset.
# Empty means any domain, but the Google account email must then equal the account's email.
kit.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}

# ========== DATABASE CONFIGURATION ==========
# Default to local SQLite. DB_URL switches the app to remote MySQL.
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.url=${DB_URL:jdbc:sqlite:volumes/sqlite.db?journal_mode=WAL}

# Dedicated Pages account for trusted assignment-owner synchronization.
# Provisioning is disabled unless PAGES_BOT_PASSWORD is explicitly configured.
assignment.sync.uid=${PAGES_BOT_UID:pages-bot}
assignment.sync.password=${PAGES_BOT_PASSWORD:}
assignment.sync.email=${PAGES_BOT_EMAIL:pages-bot@example.com}

# ========== JPA/HIBERNATE CONFIGURATION ==========
# Dialect is injected automatically from DB_URL.
# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable Open Session In View pattern (avoid lazy loading issues)
spring.jpa.open-in-view=false
# Schema management. Default "none" on an existing database; when the SQLite file
# does not exist yet, KitEnvironmentPostProcessor switches this to "update" so a fresh
# container creates its own schema. Set DDL_AUTO explicitly to override either way.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
# Quote identifiers in generated SQL (required for reserved table names like groups in MySQL)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ========== DATABASE CONNECTION POOL (HikariCP) ==========
# Connection timeout in milliseconds (60 seconds)
spring.datasource.hikari.connection-timeout=60000
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=5
# Minimum idle connections to maintain
spring.datasource.hikari.minimum-idle=5
# Connection validation timeout (3 seconds)
spring.datasource.hikari.validation-timeout=3000
# Maximum lifetime of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# ========== SPRING BOOT CONFIGURATION ==========
# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# ========== EMAIL CONFIGURATION (Gmail SMTP) ==========
# SMTP server settings (optional; email features are disabled without credentials)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Enable SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email delivery strategy
# Default provider for deployed environments; override with EMAIL_PROVIDER=smtp if needed
email.provider=${EMAIL_PROVIDER:formsubmit}
# Optional explicit reply-to for outbound messages
email.replyTo=${EMAIL_REPLY_TO:}
# FormSubmit endpoint template. Keep {recipient} token to inject issue owner email.
formsubmit.endpoint=${FORM_SUBMIT_ENDPOINT:https://formsubmit.co/ajax/{recipient}}
# Optional mapping for owner labels that are not user UIDs.
# Format: "alice:alice@example.com,bob:bob@example.com"
issue.owner.email-map=${ISSUE_OWNER_EMAIL_MAP:}

# ========== GEMINI AI CONFIGURATION ==========
# Optional: AI features return an error / stay disabled when GEMINI_API_KEY is empty.
google.api.key=${GEMINI_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

# ========== OPTIONAL EXTERNAL SERVICES ==========
# Grader model endpoint used by /grader/input (empty disables it)
chatter.model-url=${CHATTER_MODEL_URL:}
# Base URL of a service exposing /api/stocks/price_five_years_ago/{symbol} (empty disables it)
stocks.history-api-url=${STOCKS_HISTORY_API_URL:}

# ========== GITHUB API CONFIGURATION ==========
# GitHub API settings (token should be set in .env file)
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_API_TOKEN:}

# ========== SECURITY CONFIGURATION ==========
# Rate limiting: maximum requests per minute per IP
security.rate-limit.requests-per-minute=1000
security.rate-limit.admin-requests-per-minute=5000
# Endpoints excluded from rate limiting
security.rate-limit.exempt-paths=/api/jokes

# ========== AWS S3 CONFIGURATION ==========
# AWS S3 bucket name (set in .env file or environment)
aws.s3.bucket-name=${AWS_BUCKET_NAME:my-bucket}
# AWS access key ID (set in .env file or environment)
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
# AWS secret access key (set in .env file or environment)
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# AWS region (set in .env file or environment)
aws.s3.region=${AWS_REGION:us-east-1}

# ========== GITHUB GIST CONFIGURATION ==========
# GitHub Gist settings (token should be set in .env file)
gist.token=${GIST_TOKEN:}

# ========== COURSE GROUPS CONFIGURATION ==========
# Canonical course groups: seeded by ModelInit on first startup and used to
# validate profile class selection. Order is significant (membership sync and
# API responses follow it). Overriding this line in .env replaces the whole list.
courses.class-groups=CSA,CSP,CSH,CSSE
# Bell period per course group. Every name listed above needs an entry.
# Individual periods can be overridden in .env, e.g. courses.periods[CSA]=4
courses.periods[CSA]=2
courses.periods[CSP]=3
courses.periods[CSH]=2
courses.periods[CSSE]=1
# Optional course code stored on the seeded group; defaults to the group name.
# courses.course-codes[CSA]=APCSA

# Optional third-party integrations (feature disabled / errors gracefully when empty)
slack.token=${SLACK_TOKEN:}
coinmarketcap.api.key=${COINMARKETCAP_API_KEY:}
